name: Build PhotoBoothPro EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pywin32 opencv-python pillow PyQt5

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "PhotoBoothPro" photo_booth_pro.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBoothPro-Windows
          path: dist/PhotoBoothPro.exe
